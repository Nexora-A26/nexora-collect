name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify source
        run: npm run verify

      - name: Build Setup and Portable editions
        shell: cmd
        run: |
          set CSC_IDENTITY_AUTO_DISCOVERY=false
          set WIN_CSC_LINK=
          set CSC_LINK=
          npm run dist:win:unsigned

      - name: Smoke-test packaged application
        shell: powershell
        run: |
          & "release\win-unpacked\Nexora Collect.exe" --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-Collect-Windows-${{ github.ref_name }}
          path: |
            release/Nexora-Collect-Setup-*.exe
            release/Nexora-Collect-Portable-*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Nexora-Collect-Setup-*.exe
            release/Nexora-Collect-Portable-*.exe
